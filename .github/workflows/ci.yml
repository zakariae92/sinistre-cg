name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest -q

  image:
    name: Image (linux/arm64)
    runs-on: ubuntu-24.04-arm # the Oracle VM is ARM (Ampere)
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sinistre-cg:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/sinistre-cg:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy (Oracle VM)
    runs-on: ubuntu-24.04
    needs: image
    if: vars.VM_HOST != '' # skipped until configured (docs/DEPLOIEMENT.md)
    environment:
      name: production
      url: https://${{ vars.SINISTRE_DOMAIN }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      TARGET: deploy@${{ vars.VM_HOST }}
    steps:
      - uses: actions/checkout@v7
      - name: SSH identity and pinned host key
        env:
          SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.VM_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - run: scp deploy/docker-compose.prod.yml "$TARGET:/opt/sinistre/"
      - name: Roll out this commit's image
        run: |
          ssh "$TARGET" "cd /opt/sinistre \
            && sed -i 's/^SINISTRE_TAG=.*/SINISTRE_TAG=${{ github.sha }}/' .env \
            && docker compose -f docker-compose.prod.yml pull --quiet \
            && docker compose -f docker-compose.prod.yml up -d --wait --remove-orphans \
            && docker image prune -f"
      - run: curl -fsS --retry 10 --retry-delay 6 --retry-all-errors "https://${{ vars.SINISTRE_DOMAIN }}/health"
